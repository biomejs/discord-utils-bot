name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'

jobs:
  deploy:
    name: Deploy Commands & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy commands to Discord
        run: node --run deploy-commands
        env:
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            DISCORD_WEBHOOK
            DISCORD_SPONSORS_WEBHOOK
            DISCORD_WORKFLOW_WEBHOOK
            OPENCOLLECTIVE_API_TOKEN
            OPENCOLLECTIVE_WEBHOOK_TOKEN
            PUBLIC_KEY
            WEBHOOK_SECRET
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_SPONSORS_WEBHOOK: ${{ secrets.DISCORD_SPONSORS_WEBHOOK }}
          DISCORD_WORKFLOW_WEBHOOK: ${{ secrets.DISCORD_WORKFLOW_WEBHOOK }}
          OPENCOLLECTIVE_API_TOKEN: ${{ secrets.OPENCOLLECTIVE_API_TOKEN }}
          OPENCOLLECTIVE_WEBHOOK_TOKEN: ${{ secrets.OPENCOLLECTIVE_WEBHOOK_TOKEN }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
