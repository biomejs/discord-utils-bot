name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.toml'

jobs:
  deploy:
    name: Deploy Commands & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Install Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy commands to Discord
        run: node --run deploy-commands
        env:
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            DISCORD_WEBHOOK
            DISCORD_SPONSORS_WEBHOOK
            DISCORD_WORKFLOW_WEBHOOK
            OPENCOLLECTIVE_API_TOKEN
            OPENCOLLECTIVE_WEBHOOK_TOKEN
            PUBLIC_KEY
            WEBHOOK_SECRET
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_SPONSORS_WEBHOOK: ${{ secrets.DISCORD_SPONSORS_WEBHOOK }}
          DISCORD_WORKFLOW_WEBHOOK: ${{ secrets.DISCORD_WORKFLOW_WEBHOOK }}
          OPENCOLLECTIVE_API_TOKEN: ${{ secrets.OPENCOLLECTIVE_API_TOKEN }}
          OPENCOLLECTIVE_WEBHOOK_TOKEN: ${{ secrets.OPENCOLLECTIVE_WEBHOOK_TOKEN }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
